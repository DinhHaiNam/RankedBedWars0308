name: Deploy package to BedWars Repo + Create a release

on:
  push:
    branches: [development]

jobs:
  create-jar:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: 'development'
          fetch-depth: 0 # Fetch all history and tags
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: release-candidate
      - name: Ensure Gradle wrapper is executable
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi
      - name: Package with Gradle
        run: |
          ./gradlew clean tag shadowJar -Prelease
      - name: Set version
        id: set-version
        run: |
          VERSION=$(./gradlew printTag | awk '/Generated Tag:/ {print $3}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bedwars-plugin
          path: bedwars-plugin/build/libs/**.jar
          if-no-files-found: error
  release:
    runs-on: ubuntu-latest
    needs: [ create-jar ]
    permissions:
      contents: write
    steps:
      - name: Download the artifact
        uses: actions/download-artifact@v5
        with:
          name: bedwars-plugin
          path: target
      - name: Print generated tags
        run: |
          echo "Generated Tag: ${{ needs.create-jar.outputs.version }}"
      - name: Create release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: development
          tag_name: ${{ needs.create-jar.outputs.version }}
          generate_release_notes: true
          files: "target/RankedBedWars0308-*"
