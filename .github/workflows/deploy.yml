name: Deploy package to BedWars Repo + Create a release

on:
  push:
    branches: [development]

jobs:
  create-jar:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: 'development'
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Build plugin
        run: ./gradlew clean shadowJar -Prelease

      - name: Generate version
        id: set-version
        run: |
          VERSION=$(./gradlew printTag | awk '/Generated Tag:/ {print $3}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bedwars-plugin
          path: bedwars-plugin/build/libs/*.jar
          if-no-files-found: error


  release:
    runs-on: ubuntu-latest
    needs: [create-jar]
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: bedwars-plugin
          path: target

      - name: Show version
        run: echo "Generated Tag: ${{ needs.create-jar.outputs.version }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: development
          tag_name: ${{ needs.create-jar.outputs.version }}
          generate_release_notes: true
          files: "target/*.jar"


  deploy-package:
    runs-on: ubuntu-latest
    needs: [release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: 'development'
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Deploy Package
        env:
          REPO_USER: ${{ secrets.REPO_USER }}
          REPO_PASS: ${{ secrets.REPO_PASS }}
        run: |
          ./gradlew clean publish \
            --stacktrace \
            -PdeployUsername="${REPO_USER}" \
            -PdeployPassword="${REPO_PASS}"


  javadoc:
    name: Publish JavaDoc
    runs-on: ubuntu-latest
    needs: deploy-package

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: 'development'
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build JavaDoc
        run: ./gradlew javadoc --no-daemon --stacktrace

      - name: Create SSH key
        run: echo "${{ secrets.JDC_PRIVATE_KEY }}" > id_rsa

      - name: Deploy JavaDoc 🚀
        uses: wangyucode/sftp-upload-action@v2.0.4
        with:
          host: ${{ secrets.JDC_IP_ADDRESS }}
          username: ${{ secrets.JDC_USER }}
          privateKey: './id_rsa'
          localDir: 'bedwars-api/build/docs/javadoc'
          remoteDir: '/var/www/tomkeuper.com/javadocs'
          removeExtraFilesOnServer: true
